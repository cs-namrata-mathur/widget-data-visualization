<form data-ng-submit="save()" class="noMargin" name="editDataVisualizationForm"
    data-ng-class="{'state-wait': processing }" novalidate>
    <div class="modal-header">
        <h3 class="modal-title col-md-9">Edit Data Visualization</h3>
        <button type="button" class="close" data-ng-click="cancel()" data-dismiss="modal" aria-label="Close"
            id="close-edit-widget-form-btn">
            <div aria-hidden="true" class="version-button">+</div>
        </button>
    </div>
    <div class="modal-body">
        <!-- Visualization Title -->
        <div class="form-group"
            data-ng-class="{ 'has-error':  editDataVisualizationForm.title.$invalid && editDataVisualizationForm.title.$touched }">
            <label for="title" class="control-label">Title<span class="text-danger">*</span></label>
            <input id="title" name="title" type="text" class="form-control" data-ng-model="config.title" required>
            <div data-cs-messages="editDataVisualizationForm.title">
            </div>
        </div>

        <!-- Visualization Type-->
        <div class="form-group"
            data-ng-class="{ 'has-error':  editDataVisualizationForm.vizType.$invalid && editDataVisualizationForm.vizType.$touched }">
            <label for="vizType" class="control-label">Visualization Type<span class="text-danger">*</span></label>
            <select name="vizType" id="vizType" class="form-control" required data-ng-model="config.vizType"
                data-ng-options="viz.type as viz.title for viz in config.vizList | orderBy: 'title'">
                <option value="">Select an option</option>
            </select>
            <div data-cs-messages="editDataVisualizationForm.vizType"></div>
        </div>

        <!-- Data Source -->
        <div>
            <label for="editDataVisualizationForm" class="control-label">Data Source</label>
            <span class="text-danger">*
              <span
                data-uib-tooltip="Select 'Record Containing JSON Data' to render data from a single JSON record within the module. Select 'Get Live Data' to enable selection of module and fields, rendering real-time data based on specified filters"
                data-tooltip-append-to-body="true"><i class="icon icon-information font-Size-13"></i></span>
            </span>

            <!-- Radio Button -->
            <div class="row margin-bottom-sm">
                <div class="col-md-6 padding-right-0">
                    <div class="radio">
                        <label><input id="JsonField" name="JsonField" type="radio" data-ng-model="config.moduleType"
                      data-ng-change="onChangeModuleType()" value="Single Module">&nbsp;&nbsp;Record Containing JSON Data</label>
                        <span data-uib-tooltip="It allows you to select a single JSON record within the module."
                    data-tooltip-append-to-body="true"><i class="icon icon-information font-Size-13"></i></span>
                    </div>
                    <div class="radio">
                        <label><input id="accrossModules" name="accrossModules" type="radio" data-ng-model="config.moduleType"
                      data-ng-change="onChangeModuleType()" value="Across Modules">&nbsp;&nbsp;Get Live Data</label>
                        <span data-uib-tooltip="It allows you to select a module and fields, rendering real-time data." data-tooltip-append-to-body="true"><i
                      class="icon icon-information font-Size-13"></i></span>
                    </div>
                </div>
            </div>
            <!-- Radio Button End -->
        </div>

        <!-- Resource/Source -->
        <div class="form-group"
            data-ng-class="{ 'has-error': editDataVisualizationForm.resource.$invalid && editDataVisualizationForm.resource.$touched }"
            data-ng-if="modules">
            <label for="resource" class="control-label">Source<span class="text-danger">*</span>
                        <span data-uib-tooltip="Select the module whose records are to be visualize." data-tooltip-append-to-body="true">
                          <i class="margin-left-sm icon icon-information font-Size-13"></i>
                        </span>
                      </label>
            <select name="resource" id="resource" class="form-control"
                        data-ng-options="module.type as module.name for module in modules" data-ng-model="config.resource"
                        data-ng-change="loadAttributes()" required>
                        <option value="">Select an Option</option>
                      </select>
            <div data-cs-messages="editDataVisualizationForm.resource"></div>
        </div>

        <!-- To fetch from single JSON Record -->
        <div data-ng-if="config.moduleType === 'Single Module'">
            <!-- Object/JSON Field -->
            <div class="form-group"
                data-ng-class="{ 'has-error': editDataVisualizationForm.objectField.$invalid && editDataVisualizationForm.objectField.$touched }"
                data-ng-if="modules && config.resource">
                <label for="objectField" class="control-label">Select JSON Field<span class="text-danger">*</span>
                    <span data-uib-tooltip="Select the Field which has the data, only json type fields will be available in the dropdown." data-tooltip-append-to-body="true">
                      <i class="margin-left-sm icon icon-information font-Size-13"></i>
                    </span>
                </label>
                <select name="objectField" id="objectField" class="form-control"
                    data-ng-options="field.name as field.title for field in fieldsArray | filter: { type: 'object' } | orderBy: 'title'"
                    data-ng-model="config.objectField" required>
                    <option value="">Select an Option</option>
                </select>
                <div data-cs-messages="editDataVisualizationForm.objectField"></div>
            </div>
        </div>

        <!-- Live Data -->
        <div data-ng-if="config.moduleType === 'Across Modules'">
            <div data-ng-if="'wordCloud' !== config.vizType">
                <!-- Level 1 -->
                <div class="form-group"
                    data-ng-class="{ 'has-error': editDataVisualizationForm.l1PickListField.$invalid && editDataVisualizationForm.l1PickListField.$touched }"
                    data-ng-if="modules && config.resource">
                    <label for="l1PickListField" class="control-label">Level 1<span class="text-danger">*</span>
                        <span data-uib-tooltip="Select the picklist to group the records in the selected module." data-tooltip-append-to-body="true">
                        <i class="margin-left-sm icon icon-information font-Size-13"></i>
                        </span>
                    </label>
                    <select name="l1PickListField" id="l1PickListField" class="form-control"
                        data-ng-options="field.name as field.title for field in fieldsArray | filter: { type: 'picklist' } | orderBy: 'title'"
                        data-ng-model="config.l1PickListField" required>
                        <option value="">Select an Option</option>
                    </select>
                    <div data-cs-messages="editDataVisualizationForm.l1PickListField"></div>
                </div>

                <!-- Level 2 -->
                <div class="form-group"
                    data-ng-class="{ 'has-error': editDataVisualizationForm.l2PickListField.$invalid && editDataVisualizationForm.l2PickListField.$touched }"
                    data-ng-if="modules && config.resource">
                    <label for="l2PickListField" class="control-label">Level 2<span class="text-danger">*</span>
                        <span data-uib-tooltip="Select the picklist to group the records in the selected module." data-tooltip-append-to-body="true">
                        <i class="margin-left-sm icon icon-information font-Size-13"></i>
                        </span>
                    </label>
                    <select name="l2PickListField" id="l2PickListField" class="form-control"
                        data-ng-options="field.name as field.title for field in fieldsArray | filter: { type: 'picklist' } | orderBy: 'title'"
                        data-ng-model="config.l2PickListField" required>
                        <option value="">Select an Option</option>
                    </select>
                    <div data-cs-messages="editDataVisualizationForm.l2PickListField"></div>
                </div>

                <!-- Level 3 -->
                <div class="form-group"
                    data-ng-class="{ 'has-error': editDataVisualizationForm.l3PickListField.$invalid && editDataVisualizationForm.l3PickListField.$touched }"
                    data-ng-if="modules && config.resource">
                    <label for="l3PickListField" class="control-label">Level 3<span class="text-danger">*</span>
                        <span data-uib-tooltip="Select the picklist to group the records in the selected module." data-tooltip-append-to-body="true">
                        <i class="margin-left-sm icon icon-information font-Size-13"></i>
                        </span>
                    </label>
                    <select name="l3PickListField" id="l3PickListField" class="form-control"
                        data-ng-options="field.name as field.title for field in fieldsArray | filter: { type: 'picklist' } | orderBy: 'title'"
                        data-ng-model="config.l3PickListField" required>
                        <option value="">Select an Option</option>
                    </select>
                    <div data-cs-messages="editDataVisualizationForm.l3PickListField"></div>
                </div>
            </div>
            <div data-ng-if="'wordCloud' === config.vizType">
                <div class="form-group"
                    data-ng-class="{ 'has-error': editDataVisualizationForm.wordSource.$invalid && editDataVisualizationForm.wordSource.$touched }"
                    data-ng-if="modules && config.resource">
                    <label for="wordSource" class="control-label">Word Source<span class="text-danger">*</span>
                        <span data-uib-tooltip="Select the picklist to group the records in the selected module." data-tooltip-append-to-body="true">
                        <i class="margin-left-sm icon icon-information font-Size-13"></i>
                        </span>
                    </label>
                    <select name="wordSource" id="wordSource" class="form-control"
                        data-ng-options="field.name as field.title for field in fieldsArray | filter: filterByPicklistOrTextType | orderBy: 'title'"
                        data-ng-model="config.wordSource" required>
                        <option value="">Select an Option</option>
                    </select>
                    <div data-cs-messages="editDataVisualizationForm.wordSource"></div>
                </div>
            </div>
        </div>

        <!-- Spinner -->
        <cs-spinner data-ng-show="config.resource && (!fieldsArray || fieldsArray.length === 0)"></cs-spinner>

        <!-- Filter Criteria -->
        <div data-ng-hide="!config.resource || !fieldsArray || fieldsArray.length === 0">
            <div class="form-group"
                data-ng-class="{ 'has-error': editDataVisualizationForm.filters.$invalid && editDataVisualizationForm.filters.$touched }">
                <label for="filters" class="control-label">Filter Criteria</label>
                <div data-cs-conditional data-ng-if="fieldsArray.length > 0" data-fields="$parent.fields"
                    data-mode="'queryFilters'" data-ng-model="$parent.config.query"
                    data-parent-form="editDataVisualizationForm"
                    data-enable-expression="(page==='dashboard' || page==='reporting')"
                    data-reset-field="$parent.fields" data-show-uuid="true"
                    data-form-name="'editDataVisualizationForm'"></div>
                <div data-cs-messages="editDataVisualizationForm.filters"></div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button id="edit-widget-save" type="submit" class="btn btn-sm btn-primary"><i
                class="icon icon-check margin-right-sm"></i>Save</button>
        <button id="edit-widget-cancel" type="button" class="btn btn-sm btn-default" data-ng-click="cancel()"><i
                class="icon icon-close margin-right-sm"></i>Close</button>
    </div>
</form>
